name: Server GHCR Image

on:
  push:
    branches:
      - upgrade/v0.1.146
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR tag to publish'
        required: true
        default: 'sub2api-latest'
        type: string
      vite_base:
        description: 'Frontend base path baked into the image'
        required: true
        default: '/sub2api/'
        type: string
      platforms:
        description: 'Target platforms'
        required: true
        default: 'linux/arm64'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build inputs
        id: build_inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "vite_base=${{ inputs.vite_base }}" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sub2api-v0.1.146" >> "$GITHUB_OUTPUT"
            echo "vite_base=/sub2api/" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.build_inputs.outputs.platforms }}
          push: true
          build-args: |
            VITE_BASE=${{ steps.build_inputs.outputs.vite_base }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/sub2api-server:${{ steps.build_inputs.outputs.image_tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/sub2api-server:sub2api-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Sub2API server image built with VITE_BASE=${{ steps.build_inputs.outputs.vite_base }}
