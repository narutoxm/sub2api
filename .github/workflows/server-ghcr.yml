name: Server GHCR Image

on:
  push:
    branches:
      - upgrade/v0.2.2
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR tag to publish'
        required: true
        default: 'sub2api-latest'
        type: string
      vite_base:
        description: 'Frontend base path baked into the image'
        required: true
        default: '/sub2api/'
        type: string
      platforms:
        description: 'Target platforms'
        required: true
        default: 'linux/amd64'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve build inputs
        id: build_inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "vite_base=${{ inputs.vite_base }}" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sub2api-v0.2.2-amd64" >> "$GITHUB_OUTPUT"
            echo "vite_base=/sub2api/" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.build_inputs.outputs.vite_base }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          grep -aoE '(src|href)="/[^"]*(assets|logo)[^"]*"' ../backend/internal/web/dist/index.html | head -20

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Build backend binary
        working-directory: backend
        env:
          VERSION: '0.2.2'
          COMMIT: ${{ github.sha }}
        run: |
          go version
          go mod download
          DATE_VALUE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags embed \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE_VALUE} -X main.BuildType=release" \
            -trimpath \
            -o ../sub2api \
            ./cmd/server
          ../sub2api --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goreleaser
          platforms: ${{ steps.build_inputs.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/sub2api-server:${{ steps.build_inputs.outputs.image_tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/sub2api-server:sub2api-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Sub2API server image built with VITE_BASE=${{ steps.build_inputs.outputs.vite_base }}
