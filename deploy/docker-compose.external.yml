# =============================================================================
# Sub2API Docker Compose - External PostgreSQL/Redis
# =============================================================================
# This compose file runs ONLY the Sub2API service and connects to existing
# PostgreSQL and Redis containers on an external Docker network.
#
# Expected services on the external network:
# - PostgreSQL reachable as host "postgres" (5432)
# - Redis reachable as host "redis" (6379)
#
# Usage:
#   sudo docker compose -f deploy/docker-compose.external.yml --env-file deploy/.env up -d --build
# =============================================================================

services:
  sub2api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Deploy UI under https://xumin.fun/sub2api/
        VITE_BASE: /sub2api/
    image: sub2api-local:latest
    container_name: sub2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      - AUTO_SETUP=true

      # Server
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - RUN_MODE=${RUN_MODE:-standard}
      - SERVER_FRONTEND_URL=${SERVER_FRONTEND_URL:-https://xumin.fun/sub2api}

      # PostgreSQL (external)
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      # Be conservative: shared DB is used by other projects.
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-20}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-5}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      # Redis (external)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-1}
      # Be conservative: shared Redis is used by other projects.
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-256}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}

      # Admin Account
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

      # JWT / 2FA (recommend fixed values)
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}

      # Timezone
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - claude-code-hub_default
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  claude-code-hub_default:
    external: true
